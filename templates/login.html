<!doctype html>
<html lang="{{ lang or 'tr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020812">

  <title>EratGuard · Giriş Yap</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/auth-premium.css') }}">
</head>

<body class="eg-auth">
<main class="eg-auth-shell">

  <div class="eg-auth-hex" aria-hidden="true"></div>

  <header class="eg-brand">
    <img
      class="eg-brand-shield"
      src="{{ url_for('static', filename='img/eg-shield-premium.svg') }}"
      alt="EratGuard">

    <div class="eg-brand-name">
      ERAT<span>GUARD</span>
    </div>

    <div class="eg-brand-tag">
      Dijital Dünyada Güvende Olun
    </div>
  </header>

  <div class="eg-wave" aria-hidden="true"></div>

  <section class="eg-auth-content">

    <h1 class="eg-auth-title">
      Tekrar <span>Hoş Geldin</span>
    </h1>

    <p class="eg-auth-subtitle">
      Hesabına giriş yap ve korumaya devam et.
    </p>

    {% if error %}
      <div class="eg-alert eg-alert-error">
        ⚠ {{ error }}
      </div>
    {% endif %}

    <form
      class="eg-auth-form"
      method="POST"
      action="/login">

      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}">

      <div class="eg-field">
        <label for="username">
          Kullanıcı Adı
        </label>

        <div class="eg-input">
          <span class="eg-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="8"
                r="4"
                stroke="currentColor"
                stroke-width="1.8"/>

              <path
                d="M4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"/>
            </svg>
          </span>

          <input
            id="username"
            type="text"
            name="username"
            placeholder="Kullanıcı adın"
            autocomplete="username"
            required>
        </div>
      </div>

      <div class="eg-field">
        <label for="password">
          Şifre
        </label>

        <div class="eg-input">
          <span class="eg-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect
                x="5"
                y="10"
                width="14"
                height="10"
                rx="3"
                stroke="currentColor"
                stroke-width="1.8"/>

              <path
                d="M8 10V7.5a4 4 0 018 0V10"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"/>
            </svg>
          </span>

          <input
            id="password"
            type="password"
            name="password"
            placeholder="Şifren"
            autocomplete="current-password"
            required>

          <button
            class="eg-eye"
            type="button"
            onclick="togglePassword()"
            aria-label="Şifreyi göster veya gizle">

            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"/>

              <circle
                cx="12"
                cy="12"
                r="2.5"
                stroke="currentColor"
                stroke-width="1.7"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="eg-auth-row">

        <label class="eg-check" for="rememberMe">
          <input
            type="checkbox"
            name="remember"
            id="rememberMe">

          <span>Beni Hatırla</span>
        </label>

        <a
          class="eg-auth-link"
          href="/forgot-password">
          Şifremi Unuttum
        </a>
      </div>

      <button
        class="eg-btn"
        type="submit">
        Giriş Yap
      </button>

    </form>

    <div class="eg-secondary-action">
      Hesabın yok mu?
      <a href="/register">
        Kayıt Ol
      </a>
    </div>

    <div class="eg-auth-foot">
      EratGuard · Güvenli Giriş
    </div>

  </section>
</main>

<script>
function togglePassword(){
  const input = document.getElementById("password");
  input.type =
    input.type === "password"
      ? "text"
      : "password";
}
</script>

</body>
</html>
