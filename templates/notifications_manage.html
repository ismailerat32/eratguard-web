<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050812">
  <title>EratGuard · Bildirim Ayarları</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/auth-premium.css') }}">

  <style>
    .eg-settings-content{
      width:min(620px,100%);
      margin:0 auto;
    }

    .eg-settings-card{
      display:grid;
      gap:10px;
      margin-top:20px;
    }

    .eg-setting{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:16px;
      border:1px solid rgba(132,168,220,.16);
      border-radius:18px;
      background:rgba(7,15,31,.66);
    }

    .eg-setting-copy b{
      display:block;
      color:#edf6ff;
      font-size:14px;
    }

    .eg-setting-copy span{
      display:block;
      margin-top:4px;
      color:#8198b7;
      font-size:12px;
      line-height:1.4;
    }

    .eg-switch{
      position:relative;
      flex:0 0 auto;
      width:48px;
      height:27px;
    }

    .eg-switch input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .eg-slider{
      position:absolute;
      inset:0;
      border-radius:999px;
      background:#17243a;
      border:1px solid rgba(132,168,220,.20);
      cursor:pointer;
      transition:.2s ease;
    }

    .eg-slider:before{
      content:"";
      position:absolute;
      width:19px;
      height:19px;
      left:3px;
      top:3px;
      border-radius:50%;
      background:#8799b0;
      transition:.2s ease;
    }

    .eg-switch input:checked + .eg-slider{
      background:rgba(36,124,255,.40);
      border-color:rgba(73,151,255,.62);
    }

    .eg-switch input:checked + .eg-slider:before{
      transform:translateX(21px);
      background:#eaf5ff;
    }

    .eg-select-wrap{
      margin-top:10px;
    }

    .eg-select-wrap label{
      display:block;
      margin-bottom:7px;
      color:#8299b7;
      font-size:11px;
      font-weight:700;
      letter-spacing:.8px;
      text-transform:uppercase;
    }

    .eg-select{
      width:100%;
      min-height:48px;
      padding:0 14px;
      border:1px solid rgba(132,168,220,.20);
      border-radius:15px;
      outline:none;
      color:#eaf4ff;
      background:#091326;
      font:inherit;
    }

    .eg-settings-back{
      display:block;
      margin-top:16px;
      color:#8fa8c7;
      text-align:center;
      text-decoration:none;
      font-size:13px;
    }

    @media(max-width:520px){
      .eg-setting{
        padding:14px;
      }
    }
  </style>
</head>

<body class="eg-auth">
<main class="eg-auth-shell">

  <div class="eg-auth-hex" aria-hidden="true"></div>

  <section class="eg-brand">
    <img class="eg-brand-shield"
         src="{{ url_for('static', filename='img/eg-shield-premium.svg') }}"
         alt="EratGuard">

    <div class="eg-brand-name">ERATGUARD</div>
    <div class="eg-brand-tag">AKILLI KORUMA · GÜVENLİ GELECEK</div>
  </section>

  <div class="eg-wave" aria-hidden="true"></div>

  <section class="eg-auth-content eg-settings-content">

    <h1 class="eg-auth-title">
      Bildirim <span>Ayarları</span>
    </h1>

    <p class="eg-auth-subtitle">
      EratGuard'ın sana hangi güvenlik bildirimlerini ileteceğini belirle.
    </p>

    <form class="eg-auth-form"
          method="post"
          action="/u/notifications/manage">

      <input type="hidden"
             name="csrf_token"
             value="{{ csrf_token() }}">

      <div class="eg-settings-card">

        <label class="eg-setting">
          <span class="eg-setting-copy">
            <b>Bildirimler</b>
            <span>Uygulama içi güvenlik bildirimlerini etkin tut.</span>
          </span>

          <span class="eg-switch">
            <input type="checkbox"
                   name="notifications_enabled"
                   {% if settings.notifications_enabled %}checked{% endif %}>
            <span class="eg-slider"></span>
          </span>
        </label>

        <label class="eg-setting">
          <span class="eg-setting-copy">
            <b>Spam Uyarıları</b>
            <span>Şüpheli ve spam içerikler için uyarı al.</span>
          </span>

          <span class="eg-switch">
            <input type="checkbox"
                   name="spam_alerts"
                   {% if settings.spam_alerts %}checked{% endif %}>
            <span class="eg-slider"></span>
          </span>
        </label>

        <label class="eg-setting">
          <span class="eg-setting-copy">
            <b>Sessiz Mod</b>
            <span>Gereksiz bildirim yoğunluğunu azalt.</span>
          </span>

          <span class="eg-switch">
            <input type="checkbox"
                   name="quiet_mode"
                   {% if settings.quiet_mode %}checked{% endif %}>
            <span class="eg-slider"></span>
          </span>
        </label>

      </div>

      <div class="eg-select-wrap">
        <label for="minRisk">Minimum risk seviyesi</label>

        <select class="eg-select"
                id="minRisk"
                name="min_risk">
          <option value="low"
                  {% if settings.min_risk == "low" %}selected{% endif %}>
            Düşük
          </option>

          <option value="medium"
                  {% if settings.min_risk == "medium" %}selected{% endif %}>
            Orta
          </option>

          <option value="high"
                  {% if settings.min_risk == "high" %}selected{% endif %}>
            Yüksek
          </option>
        </select>
      </div>

      <button class="eg-btn" type="submit">
        <span>Ayarları Kaydet</span>
      </button>

    </form>

    <a class="eg-settings-back" href="/u/notifications">
      ← Bildirim Merkezine Dön
    </a>

  </section>

  <footer class="eg-auth-foot">
    ERATGUARD · GÜVENLİ OTURUM
  </footer>

</main>
</body>
</html>
