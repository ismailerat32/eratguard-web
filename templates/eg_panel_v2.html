<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EratGuard — Ana Koruma Çekirdeği</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#03060a;
    --bg-1:#060c14;
    --cyan:#37e6ff;
    --cyan-dim:#1c8fa6;
    --ink:#d9f4fb;
    --ink-dim:#7fa3ad;
    --line:rgba(55,230,255,0.14);
    --glass:rgba(12,26,34,0.55);
    --glass-b:rgba(90,220,255,0.16);

    --n-bell:#ffb454;
    --n-spam:#3dffb0;
    --n-brain:#b58bff;
    --n-report:#37e6ff;
    --n-radar:#ff8a5c;
    --n-medal:#ffd166;
    --n-chat:#4fc3ff;
    --n-block:#ff6b81;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Rajdhani',sans-serif;
    overflow-x:hidden;
    min-height:100%;
  }

  body{
    position:relative;
    min-height:100vh;
    padding-bottom:48px;
  }

  /* ---------- ambient backdrop ---------- */
  #dust{
    position:fixed; inset:0;
    z-index:0;
    pointer-events:none;
  }

  .vignette{
    position:fixed; inset:0;
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 50% 38%, rgba(24,70,88,0.35), transparent 60%),
      radial-gradient(ellipse 120% 80% at 50% 100%, rgba(0,0,0,0.75), transparent 55%),
      linear-gradient(180deg, #03060a 0%, #050b12 55%, #03070d 100%);
  }

  .scanlines{
    position:fixed; inset:0;
    z-index:2;
    pointer-events:none;
    opacity:.05;
    background:repeating-linear-gradient(180deg, #fff 0px, #fff 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }

  main{
    position:relative;
    z-index:3;
    max-width:560px;
    margin:0 auto;
    padding:22px 16px 0;
  }

  .frame{
    position:relative;
    border:1px solid rgba(55,230,255,.14);
    border-radius:18px;
    padding:20px 14px 26px;
  }
  .frame .corner{
    position:absolute;
    width:16px;height:16px;
    border:1.6px solid var(--cyan);
    opacity:.75;
    filter:drop-shadow(0 0 4px rgba(55,230,255,.6));
  }
  .frame .corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}
  .frame .corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 6px 0 0;}
  .frame .corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 6px;}
  .frame .corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 6px 0;}
  .frame .tag{
    position:absolute;
    font-family:'JetBrains Mono',monospace;
    font-size:8px;letter-spacing:1.5px;
    color:var(--cyan-dim);
    opacity:.8;
  }
  .frame .tag.tl-tag{top:6px;left:20px;}
  .frame .tag.tr-tag{top:6px;right:20px;}

  /* ---------- header ---------- */
  .brandbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
  }
  .brandmark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(145deg,#1a5f73,#0a2530);
    border:1px solid var(--glass-b);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;color:var(--cyan);
    box-shadow:0 0 18px rgba(55,230,255,0.25), inset 0 0 12px rgba(55,230,255,0.15);
    flex-shrink:0;
  }
  .brandtext .name{
    font-weight:700;font-size:20px;letter-spacing:.5px;
    color:#eafcff;
  }
  .brandtext .name span{color:var(--cyan);}
  .brandtext .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;letter-spacing:2.5px;color:var(--ink-dim);
    text-transform:uppercase;
  }

  /* ---------- top stat cards ---------- */
  .stat-row{
    display:grid;
    grid-template-columns:1fr 1.15fr 1fr;
    gap:9px;
    margin-bottom:26px;
  }
  .stat-card{
    background:var(--glass);
    border:1px solid var(--glass-b);
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
    backdrop-filter:blur(6px);
    position:relative;
    overflow:hidden;
  }
  .stat-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.6;
  }
  .stat-label{
    font-family:'JetBrains Mono',monospace;
    font-size:8.5px;letter-spacing:1.8px;
    color:var(--ink-dim);text-transform:uppercase;
    margin-bottom:8px;
  }
  .spark{
    display:flex;align-items:flex-end;justify-content:center;
    gap:2.5px;height:26px;margin-bottom:2px;
  }
  .spark i{
    width:4px;border-radius:1px;
    background:linear-gradient(180deg,var(--cyan),var(--cyan-dim));
    box-shadow:0 0 6px rgba(55,230,255,.5);
    opacity:.85;
  }
  .ring-wrap{position:relative;width:58px;height:58px;margin:0 auto 6px;}
  .ring-wrap svg{transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(55,230,255,.55));}
  .ring-pct{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:var(--cyan);
  }
  .stat-value{
    font-weight:700;font-size:15px;color:#eafcff;letter-spacing:.3px;
  }
  .threat-tag{
    display:inline-block;margin-top:4px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:600;letter-spacing:1px;
    color:var(--n-spam);
    text-shadow:0 0 10px rgba(61,255,176,.6);
  }

  /* ---------- core hub ---------- */
  .hub{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:1/1;
    margin:0 auto;
  }

  .beam{
    position:absolute;
    left:50%;top:-38px;
    width:2px;height:64px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, transparent, var(--cyan) 70%, var(--cyan));
    opacity:.55;
    filter:blur(.3px);
    z-index:0;
  }
  .beam::before{
    content:"";
    position:absolute; left:50%; top:0;
    width:40px;height:40px;
    transform:translate(-50%,-60%);
    background:radial-gradient(circle, rgba(55,230,255,.5), transparent 70%);
  }

  .ground{
    position:absolute;
    left:50%; bottom:-6%;
    width:92%; height:16%;
    transform:translateX(-50%);
    z-index:0;
    pointer-events:none;
  }
  .ground i{
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid rgba(55,230,255,.22);
  }
  .ground i:nth-child(2){inset:14% 8%;border-color:rgba(55,230,255,.32);}
  .ground i:nth-child(3){inset:28% 18%;border-color:rgba(55,230,255,.16);}
  .ground::before{
    content:"";
    position:absolute; left:50%; top:50%;
    width:100%; height:220%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 45% at 50% 50%, rgba(55,230,255,.16), transparent 70%);
  }
  .hub svg.links{
    position:absolute;inset:0;width:100%;height:100%;
    overflow:visible;
  }
  .link-path{
    fill:none;
    stroke:var(--cyan);
    stroke-width:1;
    opacity:.22;
  }
  .pulse{
    fill:var(--cyan);
    filter:drop-shadow(0 0 4px var(--cyan));
  }

  .core{
    position:absolute;left:50%;top:50%;
    width:29%;aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%, rgba(55,230,255,.16), rgba(4,10,14,.9) 70%);
    border:1px solid rgba(55,230,255,.55);
    box-shadow:
      0 0 30px rgba(55,230,255,.35),
      inset 0 0 24px rgba(55,230,255,.18);
    z-index:5;
  }
  .core::before,.core::after{
    content:"";position:absolute;border-radius:50%;
    border:1px solid rgba(55,230,255,.28);
  }
  .core::before{inset:-14%;animation:spin 14s linear infinite;border-style:dashed;}
  .core::after{inset:-26%;animation:spin 22s linear infinite reverse;opacity:.5;}
  .core-label{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:clamp(13px,3.6vw,19px);
    color:var(--cyan);letter-spacing:2px;
    text-shadow:0 0 14px rgba(55,230,255,.8);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .node{
    position:absolute;
    width:23%;aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    z-index:6;
    cursor:pointer;
  }
  .node .ring{
    position:absolute;inset:0;border-radius:50%;
    border:1.4px solid var(--c);
    box-shadow:0 0 16px -2px var(--c), inset 0 0 12px -4px var(--c);
    background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 16%, transparent), rgba(5,10,13,.86) 72%);
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .node:active .ring{transform:scale(.94);box-shadow:0 0 26px 0 var(--c), inset 0 0 16px -2px var(--c);}
  .node svg{width:38%;height:38%;position:relative;z-index:2;stroke:var(--c);filter:drop-shadow(0 0 5px var(--c));}
  .node-label{
    position:absolute;
    top:104%;left:50%;transform:translateX(-50%);
    white-space:nowrap;
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(8.5px,2.1vw,10.5px);
    letter-spacing:.5px;
    color:var(--ink);
    text-shadow:0 0 8px rgba(0,0,0,.9);
  }

  .n1{top:6%;left:50%;}
  .n2{top:19%;left:84%;}
  .n3{top:50%;left:96%;}
  .n4{top:81%;left:84%;}
  .n5{top:92%;left:50%;}
  .n6{top:81%;left:16%;}
  .n7{top:50%;left:4%;}
  .n8{top:19%;left:16%;}

  /* bottom-center node has no room below it — flip its label above */
  .n5 .node-label{
    top:auto;
    bottom:108%;
  }

  .caption{
    text-align:center;
    margin-top:34px;
    position:relative;
    z-index:4;
  }
  .caption h2{
    font-weight:700;font-size:19px;letter-spacing:.5px;color:#eafcff;
  }
  .caption p{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:1.5px;color:var(--n-spam);
    margin-top:4px;text-transform:uppercase;
    opacity:.85;
  }
  .caption p::before{content:"● ";}

  /* ---------- bottom stats ---------- */
  .bottom-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:26px;
    background:var(--glass);
    border:1px solid var(--glass-b);
    border-radius:16px;
    padding:16px 8px;
    backdrop-filter:blur(6px);
  }
  .b-item{text-align:center;}
  .b-icon{
    width:38px;height:38px;margin:0 auto 8px;
    border-radius:50%;
    border:1px solid rgba(61,255,176,.5);
    box-shadow:0 0 12px rgba(61,255,176,.35), inset 0 0 8px rgba(61,255,176,.2);
    display:flex;align-items:center;justify-content:center;
  }
  .b-icon svg{width:17px;height:17px;stroke:var(--n-spam);filter:drop-shadow(0 0 4px var(--n-spam));}
  .b-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;color:#eafcff;}
  .b-label{
    font-family:'JetBrains Mono',monospace;
    font-size:8px;letter-spacing:1px;color:var(--ink-dim);
    text-transform:uppercase;margin-top:3px;
  }

  @media (max-width:380px){
    .node-label{display:none;}
  }
</style>
</head>
<body>

<canvas id="dust"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<main>
<div class="frame">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <span class="tag tl-tag">SYS/01</span>
  <span class="tag tr-tag">SEC·OK</span>

  <div class="brandbar">
    <div class="brandmark">E</div>
    <div class="brandtext">
      <div class="name">Erat<span>Guard</span></div>
      <div class="sub">Pro Notification Control</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-label">7 Günlük</div>
      <div class="spark" id="spark"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Güvenlik</div>
      <div class="ring-wrap">
        <svg width="58" height="58" viewBox="0 0 58 58">
          <circle cx="29" cy="29" r="25" fill="none" stroke="rgba(55,230,255,.15)" stroke-width="4"/>
          <circle cx="29" cy="29" r="25" fill="none" stroke="#37e6ff" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="157" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-pct">100%</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tehdit</div>
      <div class="stat-value">&nbsp;</div>
      <div class="threat-tag">DÜŞÜK</div>
    </div>
  </div>

  <div class="hub" id="hub">
    <div class="ground"><i></i><i></i><i></i></div>
    <div class="beam"></div>
    <svg class="links" id="links"></svg>

    <div class="core">
      <div class="core-label">AI</div>
    </div>

    <div class="node n1" onclick="location.href='/protection'" style="--c:var(--n-spam)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L4 6 V12 C4 17 7.5 20.5 12 22 C16.5 20.5 20 17 20 12 V6 Z"/>
        <path d="M9 12 L11 14 L15.5 9"/>
      </svg>
      <div class="node-label">Spam Koruması</div>
    </div>

    <div class="node n2" onclick="location.href='/analysis'" style="--c:var(--n-brain)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.3"/>
        <path d="M12 3v2.7M12 18.3V21M21 12h-2.7M5.7 12H3M18.4 5.6l-1.9 1.9M7.5 16.5l-1.9 1.9M18.4 18.4l-1.9-1.9M7.5 7.5 5.6 5.6"/>
      </svg>
      <div class="node-label">AI Analiz</div>
    </div>

    <div class="node n3" onclick="location.href='/analysis'" style="--c:var(--n-radar)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v6"/>
        <path d="M8 5a6 6 0 1 0 8 0"/>
        <circle cx="12" cy="14" r="1.4" fill="currentColor" stroke="none"/>
        <path d="M12 15.4V22"/>
      </svg>
      <div class="node-label">Risk Tarama</div>
    </div>

    <div class="node n4" onclick="location.href='/blocked'" style="--c:var(--n-block)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M6.2 17.8 17.8 6.2"/>
      </svg>
      <div class="node-label">Engellenenler</div>
    </div>

    <div class="node n5" onclick="location.href='/notifications'" style="--c:var(--n-chat)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h11a3 3 0 0 1 3 3v3.5a3 3 0 0 1-3 3H10l-4 3v-3H6a3 3 0 0 1-3-3V8a2.5 2.5 0 0 1 1-2.5Z"/>
        <path d="M14.5 12.5h4a2.5 2.5 0 0 1 2.5 2.5v2a2.5 2.5 0 0 1-2 2.45V21l-3-1.5"/>
      </svg>
      <div class="node-label">SMS Merkezi</div>
    </div>

    <div class="node n6" onclick="location.href='/license'" style="--c:var(--n-medal)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="5.5"/>
        <path d="M8.3 13.2 6.5 21l5.5-3 5.5 3-1.8-7.8"/>
      </svg>
      <div class="node-label">Lisans</div>
    </div>

    <div class="node n7" onclick="location.href='/reports'" style="--c:var(--n-report)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/>
      </svg>
      <div class="node-label">Raporlar</div>
    </div>

    <div class="node n8" onclick="location.href='/community'" style="--c:var(--n-bell)">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/>
        <path d="M10 19.5a2 2 0 0 0 4 0"/>
      </svg>
      <div class="node-label">Bildirimler</div>
    </div>

  </div>

  <div class="caption">
    <h2>Ana Koruma Çekirdeği</h2>
    <p>Sistem aktif ve senkronize</p>
  </div>

  <div class="bottom-stats">
    <div class="b-item">
      <div class="b-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6.2 17.8 17.8 6.2"/></svg></div>
      <div class="b-num">0</div>
      <div class="b-label">Engellenen</div>
    </div>
    <div class="b-item">
      <div class="b-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div class="b-num">0</div>
      <div class="b-label">Toplam Tarama</div>
    </div>
    <div class="b-item">
      <div class="b-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
      <div class="b-num">0</div>
      <div class="b-label">Güvenli</div>
    </div>
    <div class="b-item">
      <div class="b-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18M5 4h11l-2.5 3.5L16 11H5"/></svg></div>
      <div class="b-num">0</div>
      <div class="b-label">Şikayet Edilen</div>
    </div>
  </div>

</div>
</main>

<script>
  // sparkline bars
  const spark = document.getElementById('spark');
  const vals = [30,45,28,60,38,72,50];
  vals.forEach(v=>{
    const bar = document.createElement('i');
    bar.style.height = v*0.34+'px';
    spark.appendChild(bar);
  });

  // connection lines + traveling pulses between each node and the core
  const hub = document.getElementById('hub');
  const svg = document.getElementById('links');
  const core = hub.querySelector('.core');
  const nodes = [...hub.querySelectorAll('.node')];

  function layout(){
    svg.innerHTML = '';
    const rect = hub.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);

    nodes.forEach((node,i)=>{
      const nr = node.getBoundingClientRect();
      const hr = hub.getBoundingClientRect();
      const nx = nr.left - hr.left + nr.width/2;
      const ny = nr.top - hr.top + nr.height/2;

      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const d = `M ${nx} ${ny} L ${cx} ${cy}`;
      path.setAttribute('d', d);
      path.setAttribute('class','link-path');
      svg.appendChild(path);

      const pulse = document.createElementNS('http://www.w3.org/2000/svg','circle');
      pulse.setAttribute('r','2.6');
      pulse.setAttribute('class','pulse');
      const len = Math.hypot(nx-cx, ny-cy);
      const dur = 2.6 + (i%4)*0.5;
      const delay = i*0.35;
      const anim = document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
      anim.setAttribute('dur', dur+'s');
      anim.setAttribute('repeatCount','indefinite');
      anim.setAttribute('path', d);
      anim.setAttribute('begin', delay+'s');
      pulse.appendChild(anim);
      const anim2 = document.createElementNS('http://www.w3.org/2000/svg','animate');
      anim2.setAttribute('attributeName','opacity');
      anim2.setAttribute('values','0;1;1;0');
      anim2.setAttribute('keyTimes','0;0.08;0.85;1');
      anim2.setAttribute('dur', dur+'s');
      anim2.setAttribute('repeatCount','indefinite');
      anim2.setAttribute('begin', delay+'s');
      pulse.appendChild(anim2);
      svg.appendChild(pulse);
    });
  }
  window.addEventListener('resize', layout);
  setTimeout(layout, 60);

  // ambient dust particles
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  let W,H,particles=[];
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function initParticles(){
    particles = Array.from({length:70},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+0.3,
      vy:-(Math.random()*0.18+0.04),
      vx:(Math.random()-0.5)*0.08,
      a:Math.random()*0.5+0.15
    }));
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-5) p.y = H+5;
      if(p.x<-5) p.x = W+5;
      if(p.x>W+5) p.x = -5;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(80,220,255,${p.a})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  resize(); initParticles(); tick();
  window.addEventListener('resize', ()=>{resize(); initParticles();});
async function loadStats(){

const data=await res.json();
document.querySelectorAll(".b-num")[0].textContent=data.spam??0;
document.querySelectorAll(".b-num")[1].textContent=data.total??0;

}

loadLogs();
